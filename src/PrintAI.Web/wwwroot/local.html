<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Print AI · Local</title>
  <link rel="stylesheet" href="/site.css?v=ai-local-complete-v1">
</head>
<body>
<main>
  <span id="status" class="sr-only" role="status" aria-live="polite">Đang kết nối…</span>
  <div class="grid local-workspace">
    <section class="workflow-column">
      <div class="card upload-card">
        <form id="upload-form">
          <div class="upload-header">
            <h2>Chọn ảnh, PDF hoặc Office</h2>
            <div class="row upload-actions"><label id="choose-files-button" for="files-input" class="button icon-only" aria-label="Chọn ảnh, PDF hoặc Office" title="Chọn ảnh, PDF hoặc Office"><svg aria-hidden="true" focusable="false"><use href="/icons.svg#upload"></use></svg></label><button id="remove-sources-button" class="danger secondary icon-only" type="button" aria-label="Xóa file đang chọn" title="Xóa file đang chọn" disabled><svg aria-hidden="true" focusable="false"><use href="/icons.svg#trash"></use></svg></button><input id="files-input" class="file-input" type="file" accept=".jpg,.jpeg,.png,.heic,.heif,.pdf,.doc,.docx,.docm,.dot,.dotx,.dotm,.rtf,.xls,.xlsx,.xlsm,.xlsb,.xlt,.xltx,.xltm,.ppt,.pptx,.pptm,.pps,.ppsx,.ppsm,.pot,.potx,.potm" multiple></div>
          </div>
          <div id="file-drop-zone" class="file-drop-zone" tabindex="0" role="button" aria-label="Kéo thả file vào đây hoặc chọn file">
            <strong>Kéo thả nhiều file vào đây</strong>
            <span class="muted">hoặc bấm nút chọn file</span>
          </div>
          <div id="upload-status" class="muted upload-status" aria-live="polite"></div>
        </form>
        <div id="source-delete-confirm" class="queue-entry" role="alert" hidden>
          <div id="source-delete-text" class="queue-entry-text"></div>
          <div class="row"><button id="source-delete-confirm-button" class="danger icon-only" type="button" aria-label="Xóa file" title="Xóa file"><svg aria-hidden="true" focusable="false"><use href="/icons.svg#trash"></use></svg></button><button id="source-delete-cancel-button" class="secondary icon-only" type="button" aria-label="Giữ lại" title="Giữ lại"><svg aria-hidden="true" focusable="false"><use href="/icons.svg#close"></use></svg></button></div>
        </div>
        <div id="sources"></div>
      </div>
      <div id="job-form" class="card">
        <div class="planner-layout">
          <div class="planner-controls">
            <form id="planner-form" class="planner-form" autocomplete="off">
              <textarea id="planner-request" class="local-request" rows="1" maxlength="2000" aria-label="Yêu cầu" placeholder="Mô tả thứ bạn muốn tạo, chỉnh sửa hoặc in"></textarea>
              <button id="planner-send-button" class="planner-send-button" type="submit" aria-label="Gửi yêu cầu" title="Gửi yêu cầu" disabled><svg aria-hidden="true" focusable="false"><use href="/icons.svg#send"></use></svg></button>
            </form>
            <div id="planner-status" class="sr-only" role="status" aria-live="polite">Đang kiểm tra AGY…</div>
            <div id="request-queue" class="sr-only" aria-live="polite"></div>
            <div id="planner-result" class="sr-only planner-result"></div>
            <div id="planner-clarification" class="planner-clarification" hidden>
              <div id="planner-question" class="planner-question"></div>
              <form id="planner-answer-form" autocomplete="off"><input id="planner-answer" type="text" maxlength="1000" aria-label="Trả lời câu hỏi của AGY" placeholder="Nhập câu trả lời rồi nhấn Enter"></form>
            </div>
          </div>
        </div>
      </div>
      <p id="message" class="error" role="status"></p>
    </section>
    <section class="card preview-workspace" aria-label="Preview và in">
      <div class="preview-topbar">
        <div class="preview-controls">
          <div class="printer-toolbar">
            <label>Máy in <select id="printer-select" class="printer-select" disabled><option value="">Đang tìm máy in…</option></select></label>
            <label>Số bộ in <input id="print-copies" class="print-copies" type="number" min="1" max="100" value="1" disabled></label>
            <button id="print-button" class="icon-only" type="button" aria-label="Gửi tới máy in" title="Gửi tới máy in" disabled><svg aria-hidden="true" focusable="false"><use href="/icons.svg#printer"></use></svg></button>
            <button id="printer-refresh" type="button" class="secondary icon-only" aria-label="Tải lại máy in" title="Tải lại máy in"><svg aria-hidden="true" focusable="false"><use href="/icons.svg#refresh"></use></svg></button>
          </div>
          <div id="printer-message" class="muted printer-message" role="status" aria-live="polite">Đang tìm máy in…</div>
        </div>
        <div class="preview-toolbar" role="group" aria-label="Thao tác preview">
          <button id="source-preview-tab" class="secondary icon-only active" type="button" aria-label="Bản gốc" title="Bản gốc" aria-pressed="true"><svg aria-hidden="true" focusable="false"><use href="/icons.svg#file"></use></svg></button>
          <button id="print-preview-tab" class="secondary icon-only" type="button" aria-label="Trước khi in" title="Trước khi in" aria-pressed="false" disabled><svg aria-hidden="true" focusable="false"><use href="/icons.svg#eye"></use></svg></button>
          <button id="pdf-button" class="secondary icon-only pdf-download" type="button" aria-label="Tải PDF A4" title="Tải PDF A4" disabled><svg aria-hidden="true" focusable="false"><use href="/icons.svg#download"></use></svg></button>
        </div>
      </div>
      <div id="source-preview-panel" class="preview-panel">
        <aside class="source-review-panel" aria-labelledby="source-preview-title">
          <header class="source-review-header">
            <h2 id="source-preview-title">Bản gốc</h2>
            <div id="source-preview-name" class="muted source-preview-name">Chưa có file</div>
            <span id="source-preview-status" class="muted" role="status" aria-live="polite">Chọn file để xem</span>
          </header>
          <div id="source-preview-layout" class="source-preview-layout">
            <nav id="source-preview-thumbnails" class="source-preview-thumbnails" aria-label="Thumbnail các trang" hidden></nav>
            <div id="source-preview-canvas" class="source-preview-canvas" tabindex="0" aria-label="Preview trang đang chọn">
              <div id="source-preview-pages" class="source-preview-pages"></div>
            </div>
          </div>
        </aside>
      </div>
      <div id="print-preview-panel" class="preview-panel" hidden>
        <div id="pages" class="pages"></div>
        <img id="preview" class="preview" alt="Preview bố cục A4" hidden>
        <div id="job-summary" class="sr-only" role="status" aria-live="polite">Chưa có kế hoạch in.</div>
      </div>
    </section>
  </div>
</main>
<script src="/local.js?v=ai-local-complete-v1" defer></script>
<script src="/local-source-preview.js?v=ai-local-complete-v1" defer></script>
<script src="/local-sources.js?v=ai-local-complete-v1" defer></script>
<script src="/local-queue.js?v=ai-local-complete-v1" defer></script>
<script src="/local-planner.js?v=ai-local-complete-v1" defer></script>
</body>
</html>
