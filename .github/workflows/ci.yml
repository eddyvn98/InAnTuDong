name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tests
        run: dotnet restore tests/PrintAI.Tests/PrintAI.Tests.csproj

      - name: Test
        run: dotnet test tests/PrintAI.Tests/PrintAI.Tests.csproj -c Release --no-restore

      - name: Check local web JavaScript syntax
        shell: pwsh
        run: |
          $html = Get-Content src/PrintAI.Desktop/local-web/index.html -Raw
          $startTag = "<script>"
          $endTag = "</script>"
          $start = $html.IndexOf($startTag, [StringComparison]::OrdinalIgnoreCase)
          $end = $html.IndexOf($endTag, [StringComparison]::OrdinalIgnoreCase)

          if ($start -lt 0 -or $end -le $start) {
            throw "local-web/index.html does not contain an inline script."
          }

          $start += $startTag.Length
          $script = $html.Substring($start, $end - $start)
          $scriptPath = Join-Path $env:RUNNER_TEMP "printai-local-web.js"
          Set-Content -Path $scriptPath -Value $script -Encoding utf8
          node --check $scriptPath

      - name: Build web
        run: dotnet build src/PrintAI.Web/PrintAI.Web.csproj -c Release

      - name: Restore Windows printer tests
        if: matrix.os == 'windows-latest'
        run: dotnet restore tests/PrintAI.Windows.Tests/PrintAI.Windows.Tests.csproj

      - name: Test Windows printer probe
        if: matrix.os == 'windows-latest'
        run: dotnet test tests/PrintAI.Windows.Tests/PrintAI.Windows.Tests.csproj -c Release --no-restore

      - name: Build Windows printer probe
        if: matrix.os == 'windows-latest'
        run: dotnet build src/PrintAI.WindowsProbe/PrintAI.WindowsProbe.csproj -c Release

      - name: Smoke-run Windows printer probe
        if: matrix.os == 'windows-latest'
        run: dotnet run --project src/PrintAI.WindowsProbe/PrintAI.WindowsProbe.csproj -c Release --no-build

      - name: Build Windows desktop shell
        if: matrix.os == 'windows-latest'
        run: dotnet build src/PrintAI.Desktop/PrintAI.Desktop.csproj -c Release
