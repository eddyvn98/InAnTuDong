name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tests
        run: dotnet restore tests/PrintAI.Tests/PrintAI.Tests.csproj

      - name: Test
        run: dotnet test tests/PrintAI.Tests/PrintAI.Tests.csproj -c Release --no-restore

      - name: Build web
        run: dotnet build src/PrintAI.Web/PrintAI.Web.csproj -c Release
