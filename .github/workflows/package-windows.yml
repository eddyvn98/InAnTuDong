name: package-windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-win-x64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check local web JavaScript syntax
        shell: pwsh
        run: |
          $html = Get-Content src/PrintAI.Desktop/local-web/index.html -Raw
          $startTag = "<script>"
          $endTag = "</script>"
          $start = $html.IndexOf($startTag, [StringComparison]::OrdinalIgnoreCase)
          $end = $html.IndexOf($endTag, [StringComparison]::OrdinalIgnoreCase)

          if ($start -lt 0 -or $end -le $start) {
            throw "local-web/index.html does not contain an inline script."
          }

          $start += $startTag.Length
          $script = $html.Substring($start, $end - $start)
          $scriptPath = Join-Path $env:RUNNER_TEMP "printai-local-web.js"
          Set-Content -Path $scriptPath -Value $script -Encoding utf8
          node --check $scriptPath

      - name: Publish self-contained desktop
        run: >
          dotnet publish src/PrintAI.Desktop/PrintAI.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/PrintAI-win-x64

      - name: Add build manifest
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/PrintAI.Desktop/PrintAI.Desktop.csproj
          $versionNode = $project.SelectSingleNode("/Project/PropertyGroup/Version")
          if ($null -eq $versionNode) {
            throw "Desktop project does not define Version."
          }
          $version = $versionNode.InnerText

          @(
            "product=Print AI"
            "version=$version"
            "runtime=win-x64"
            "commit=$env:GITHUB_SHA"
            "configuration=Release"
          ) | Set-Content artifacts/PrintAI-win-x64/BUILD.txt

      - name: Verify package layout
        shell: pwsh
        run: |
          $required = @(
            "artifacts/PrintAI-win-x64/PrintAI.exe",
            "artifacts/PrintAI-win-x64/ui/index.html",
            "artifacts/PrintAI-win-x64/local-web/index.html",
            "artifacts/PrintAI-win-x64/INSTALL_WINDOWS.md",
            "artifacts/PrintAI-win-x64/BUILD.txt",
            "artifacts/PrintAI-win-x64/Install-PrintAI.ps1",
            "artifacts/PrintAI-win-x64/Rollback-PrintAI.ps1",
            "artifacts/PrintAI-win-x64/Uninstall-PrintAI.ps1"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Missing package file: $path"
            }
          }

          $sizeMb = [Math]::Round(
            ((Get-ChildItem artifacts/PrintAI-win-x64 -Recurse -File |
              Measure-Object Length -Sum).Sum / 1MB),
            1)

          Write-Host "Published package size: $sizeMb MB"

      - name: Smoke-test packaged desktop
        shell: pwsh
        run: |
          $report = "artifacts/PrintAI-selftest.json"
          $exe = (Resolve-Path "artifacts/PrintAI-win-x64/PrintAI.exe").Path

          $process = Start-Process `
            -FilePath $exe `
            -ArgumentList "--self-test", "--self-test-output", $report `
            -Wait `
            -PassThru `
            -WindowStyle Hidden

          if (-not (Test-Path $report)) {
            throw "Packaged self-test did not produce a report."
          }

          Get-Content $report

          if ($process.ExitCode -ne 0) {
            throw "Packaged self-test failed with exit code $($process.ExitCode)."
          }

      - name: Smoke-test install, upgrade, rollback and uninstall
        shell: pwsh
        run: |
          $source = (Resolve-Path "artifacts/PrintAI-win-x64").Path
          $installRoot = Join-Path (Resolve-Path "artifacts").Path "install-smoke\PrintAI"
          $installedReport = "artifacts/PrintAI-installed-selftest.json"

          & (Join-Path $source "Install-PrintAI.ps1") `
            -InstallRoot $installRoot `
            -NoShortcuts `
            -NoLaunch

          if (-not (Test-Path (Join-Path $installRoot "PrintAI.exe"))) {
            throw "Install smoke test did not create PrintAI.exe."
          }

          $installedExe = (Resolve-Path (Join-Path $installRoot "PrintAI.exe")).Path
          $process = Start-Process `
            -FilePath $installedExe `
            -ArgumentList "--self-test", "--self-test-output", $installedReport `
            -Wait `
            -PassThru `
            -WindowStyle Hidden

          if ($process.ExitCode -ne 0 -or -not (Test-Path $installedReport)) {
            throw "Installed Print AI self-test failed."
          }

          Set-Content (Join-Path $installRoot "rollback-marker.txt") "previous-install"

          & (Join-Path $source "Install-PrintAI.ps1") `
            -InstallRoot $installRoot `
            -NoShortcuts `
            -NoLaunch

          $previousRoot = "$installRoot.previous"
          if (-not (Test-Path (Join-Path $previousRoot "rollback-marker.txt"))) {
            throw "Upgrade smoke test did not retain the previous installation."
          }

          & (Join-Path $source "Rollback-PrintAI.ps1") `
            -InstallRoot $installRoot `
            -NoShortcuts `
            -NoLaunch

          if (-not (Test-Path (Join-Path $installRoot "rollback-marker.txt"))) {
            throw "Rollback smoke test did not restore the previous installation."
          }

          & (Join-Path $source "Uninstall-PrintAI.ps1") `
            -InstallRoot $installRoot `
            -NoShortcuts

          if ((Test-Path $installRoot) -or (Test-Path "$installRoot.previous")) {
            throw "Uninstall smoke test left application directories behind."
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive             -Path artifacts/PrintAI-win-x64/*             -DestinationPath artifacts/PrintAI-win-x64.zip             -CompressionLevel Optimal

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash artifacts/PrintAI-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  PrintAI-win-x64.zip" | Set-Content artifacts/PrintAI-win-x64.sha256.txt
          Write-Host "SHA-256: $hash"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: PrintAI-win-x64
          path: |
            artifacts/PrintAI-win-x64.zip
            artifacts/PrintAI-win-x64.sha256.txt
            artifacts/PrintAI-selftest.json
            artifacts/PrintAI-installed-selftest.json
          if-no-files-found: error
          retention-days: 14
